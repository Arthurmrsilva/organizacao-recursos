sonar.projectKey=Arthurmrsilva_organizacao-recursos
sonar.organization=arthurmrsilva
sonar.projectName=organizacao-recursos
sonar.sourceEncoding=UTF-8

# Analisa o projeto e identifica os testes separadamente.
sonar.sources=.
sonar.tests=tests,e2e
sonar.exclusions=tests/**,e2e/**,.venv/**,venv/**,backups/**,htmlcov/**,**/__pycache__/**,coverage.json,coverage.xml

# Relatorio produzido pelos testes no GitHub Actions.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14