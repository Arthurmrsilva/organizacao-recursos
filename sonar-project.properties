sonar.projectKey=Arthurmrsilva_organizacao-recursos
sonar.organization=arthurmrsilva
sonar.projectName=organizacao-recursos
sonar.sourceEncoding=UTF-8

# Codigo da aplicacao e arquivos de teste
sonar.sources=.
sonar.tests=tests,e2e,teste_concorrencia_http.py,teste_testcontainers.py
