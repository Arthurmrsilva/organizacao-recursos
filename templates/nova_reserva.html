<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova reserva — Organização de Recursos</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Organização de Recursos</h1>
        <p>Reserva de salas, professores e materiais</p>
    </header>

    <main>
        <section>
            <h2>Nova reserva</h2>
            <p>Selecione o recurso e informe o período de utilização.</p>

            {% if recursos %}
                <form class="formulario-reserva">
                    <div>
                        <label for="recurso_id">Recurso</label>
                        <select id="recurso_id" name="recurso_id" required>
                            <option value="">Selecione um recurso</option>

                            {% for recurso in recursos %}
                                <option value="{{ recurso.id }}">
                                    {{ recurso.nome }} — {{ recurso.tipo }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label for="inicio">Data e horário de início</label>
                        <input type="datetime-local"
                               id="inicio"
                               name="inicio"
                               required>
                    </div>

                    <div>
                        <label for="fim">Data e horário de término</label>
                        <input type="datetime-local"
                               id="fim"
                               name="fim"
                               required>
                    </div>

                    <div>
                        <label for="finalidade">Finalidade da reserva</label>
                        <textarea id="finalidade"
                                  name="finalidade"
                                  maxlength="200"
                                  rows="3"
                                  required></textarea>
                    </div>

                    <p>A gravação será habilitada na próxima etapa.</p>

                    <button class="botao" type="button" disabled>
                        Reservar
                    </button>
                </form>
            {% else %}
                <p>Não há recursos ativos cadastrados para reservar.</p>
            {% endif %}

            <p>
                <a class="botao botao-secundario"
                   href="{{ url_for('inicio') }}">
                    Voltar
                </a>
            </p>
        </section>
    </main>
</body>
</html>
